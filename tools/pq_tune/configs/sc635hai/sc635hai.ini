;
; SC635HAI 6MP (3200x1800) @ 20fps -- PQTools control-mode config
;
; This config describes the pipeline geometry so ittb_control can
; attach to an already-running ISP pipe (superb or pipeline_test).
; It does NOT start a pipeline itself -- it only provides sensor
; identity and parameter context for the PQTools PC application.
;
; Derived from sc4336p_4M30.ini with SC635HAI-specific values from:
;   driver/src/sc635hai_cmos.h   (resolution, bayer, gain model)
;   driver/test/pipeline_test.c  (MIPI lanes, data type, pub_attr)
;
[isp]
isp_num = 1
interrupt_bottom_half = 0
[isp.0]
dev_id = 0
sensor_type = g_sns_sc635hai_obj
                                        ;sensor name
sensor_lib_file = ./libs/libsns_sc635hai.so

mirror_flip_type = 0
                                        ;ISP_SNS_NORMAL      = 0,
                                        ;ISP_SNS_MIRROR      = 1,
                                        ;ISP_SNS_FLIP        = 2,
                                        ;ISP_SNS_MIRROR_FLIP = 3,
blc_clamp_en = TRUE
wdr_mode_num = 1
use_wdr_mode = 0
                                        ;OT_WDR_MODE_NONE = 0
wdr_mode0 = 0
use_mipi_mode0 = 0
